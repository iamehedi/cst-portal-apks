name: cst_portal
description: CST Department Portal - Android App

publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  provider: ^6.1.1
  file_picker: ^11.0.2
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  firebase_remote_config: ^6.5.1
  flutter_local_notifications: ^18.0.1
  http: ^1.6.0
  mime: ^2.0.0
  timezone: ^0.10.1
  flutter_markdown_plus: ^1.0.7
  path_provider: ^2.1.5
  device_info_plus: ^12.4.0
  package_info_plus: ^8.0.0
  mobile_scanner: ^6.0.0
  csv: ^8.0.0
  archive: ^4.0.9
  printing: ^5.14.3

  xml: any
  pdf: any
  cached_network_image: ^3.4.1
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  pdfrx: ^2.2.24
  firebase_crashlytics: ^5.2.3
  firebase_analytics: ^12.4.2
  connectivity_plus: ^7.1.1
  crop_your_image: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  mockito: ^5.7.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: fonts/NotoColorEmoji.ttf
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"

